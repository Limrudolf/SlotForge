name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile
        run: |
          ./gradlew \
            :shared:compileJava \
            :api-service:compileJava \
            :worker-service:compileJava \
            --no-daemon

      - name: Run tests
        run: |
          ./gradlew \
            :shared:test \
            :api-service:test \
            :worker-service:test \
            --no-daemon

      - name: Build executable service JARs
        run: |
          ./gradlew \
            :api-service:bootJar \
            :worker-service:bootJar \
            --no-daemon