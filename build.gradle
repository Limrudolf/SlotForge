plugins {
    id 'base'
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'org.owasp.dependencycheck' version '12.2.2'
}

allprojects {
    group = 'com.slotforge'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

dependencyCheck {
    failBuildOnCVSS = 7.0
    failOnError = true
    formats = ['HTML', 'JSON']
    outputDirectory = layout.buildDirectory
            .dir('reports/dependency-check')
            .get()
            .asFile
            .path

    def nvdApiKey = providers.gradleProperty('nvdApiKey').orNull
    if (nvdApiKey) {
        nvd {
            apiKey = nvdApiKey
        }
    }
}
