plugins {
    id 'base'
    id 'org.springframework.boot' version '4.1.0' apply false
}

allprojects {
    group = 'com.slotforge'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}