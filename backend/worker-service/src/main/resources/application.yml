spring:
  application:
    name: slotforge-worker

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: SlotForge Worker
    description: Asynchronous worker service for the SlotForge booking platform
    version: ${APP_VERSION:local}