spring:
  application:
    name: slotforge-api

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
info:
  app:
    name: SlotForge API
    description: API service for the SlotForge booking platform
    version: ${APP_VERSION:local}