spring:
  application:
    name: slotforge-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/slotforge}
    username: ${DATABASE_USERNAME:slotforge}
    password: ${DATABASE_PASSWORD:slotforge_local_password}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
info:
  app:
    name: SlotForge API
    description: API service for the SlotForge booking platform
    version: ${APP_VERSION:local}