spring:
  application:
    name: slotforge-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/slotforge}
    username: ${DATABASE_USERNAME:slotforge}
    password: ${DATABASE_PASSWORD:slotforge_local_password}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
info:
  app:
    name: SlotForge API
    description: API service for the SlotForge booking platform
    version: ${APP_VERSION:local}

slotforge:
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://api.slotforge.local}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      secret-base64: ${JWT_SECRET_BASE64:U2xvdEZvcmdlLWxvY2FsLWRldmVsb3BtZW50LWtleS0zMi1ieXRlcyE=}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:30d}
      random-bytes: ${REFRESH_TOKEN_RANDOM_BYTES:32}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      max-age: ${CORS_MAX_AGE:1h}
